name: Validate Document System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-system-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static application
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -print0)

          test ! -f sw.js

          if grep -R -nE 'premium-v[0-9]+|premium-[A-Za-z0-9_-]+|\?v=|forceCloseModal|serviceWorker\.getRegistrations|docsys_start_signature_flow_v[0-9]+|san-pedro-document-draft-v[0-9]+' \
            --include='*.js' --include='*.html' --include='*.css' .; then
            echo "Legacy or transitional pattern detected."
            exit 1
          fi

          for css in styles-core.css styles-cloud.css styles-signatures.css styles-archive.css styles-feedback.css; do
            test -f "$css"
          done

          grep -q 'docsys_session_status' cloud/supabase.js
          grep -q 'createArchiveController' cloud.js
          grep -q 'createAuthController' cloud.js
          grep -q 'createDraftController' cloud.js
          grep -q 'initStudioShell' app.js
          grep -q 'docsys_start_signature_flow' cloud.js

          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          ids=re.findall(r'\sid=["\']([^"\']+)["\']',html)
          dup=sorted({item for item in ids if ids.count(item)>1})
          if dup:
              raise SystemExit("Duplicate HTML ids: "+", ".join(dup))
          PY
