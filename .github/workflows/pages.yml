name: Validate and Deploy Document System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: document-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical application
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -print0)

          test ! -f sw.js

          if grep -R -nE 'premium-v[0-9]+|premium-[A-Za-z0-9_-]+|\?v=|forceCloseModal|serviceWorker\.getRegistrations|docsys_start_signature_flow_v[0-9]+|san-pedro-document-draft-v[0-9]+'             --include='*.js' --include='*.html' --include='*.css' .; then
            echo "Legacy or transitional pattern detected."
            exit 1
          fi

          for css in styles-core.css styles-cloud.css styles-signatures.css styles-archive.css styles-feedback.css; do
            test -f "$css"
          done

          grep -q 'docsys_session_status' cloud/supabase.js
          grep -q 'createArchiveController' cloud.js
          grep -q 'createAuthController' cloud.js
          grep -q 'createDraftController' cloud.js
          grep -q 'initStudioShell' app.js
          grep -q 'docsys_start_signature_flow' cloud.js

          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          ids=re.findall(r'\sid=["\']([^"\']+)["\']',html)
          dup=sorted({item for item in ids if ids.count(item)>1})
          if dup:
              raise SystemExit("Duplicate HTML ids: "+", ".join(dup))
          PY

      - name: Assemble static release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/cloud

          cp index.html dist/
          cp *.js dist/
          cp *.css dist/
          cp favicon.svg manifest.webmanifest dist/
          cp cloud/*.js dist/cloud/

          touch dist/.nojekyll

          test -f dist/cloud/supabase.js
          grep -q 'docsys_session_status' dist/cloud/supabase.js
          if grep -R -n 'docsys_is_member' dist --include='*.js' --include='*.html'; then
            echo "Deprecated session RPC found in release artifact."
            exit 1
          fi

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy canonical site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
